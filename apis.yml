aid: agentpay
name: AgentPay
description: AgentPay provides pay‑per‑call web extraction, DNS/network intelligence, and document processing tools for AI agents. It offers REST
  APIs and MCP servers for extracting web pages to markdown, performing DNS and WHOIS lookups, parsing PDFs, RSS/Atom feeds, and generating site
  sitemaps, all billed per request via x402 on Base or Algorand. No signup required, with free trial credits and transparent pricing.
